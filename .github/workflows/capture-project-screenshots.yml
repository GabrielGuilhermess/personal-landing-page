name: Capture LAND-0006 project screenshots

on:
  push:
    branches:
      - feat/LAND-0006-project-showcase
    paths:
      - .github/workflows/capture-project-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/LAND-0006-project-showcase

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture published applications
        run: |
          mkdir -p public/images/projects
          node <<'EOF'
          const { chromium } = require('playwright');

          const captures = [
            {
              name: 'DevToolbox',
              url: 'https://dev-toolbox-sigma.vercel.app/',
              file: 'public/images/projects/devtoolbox-2026-09-02.png',
              expected: 'Dev Toolbox',
            },
            {
              name: 'Economia Brasil',
              url: 'https://dashboard-economia-brasil.vercel.app/dashboard',
              file: 'public/images/projects/economia-brasil-2026-09-02.png',
              expected: 'Economia',
            },
          ];

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });

            for (const capture of captures) {
              await page.goto(capture.url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(3000);
              const text = await page.locator('body').innerText();
              if (!text.toLowerCase().includes(capture.expected.toLowerCase())) {
                throw new Error(`${capture.name}: expected text not found in rendered page`);
              }
              await page.screenshot({ path: capture.file, fullPage: false });
              console.log(`${capture.name}: ${capture.file} (${text.length} rendered text chars)`);
            }

            await browser.close();
          })();
          EOF

      - name: Validate captures
        run: |
          file public/images/projects/*.png
          test -s public/images/projects/devtoolbox-2026-09-02.png
          test -s public/images/projects/economia-brasil-2026-09-02.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects/*.png
          git diff --cached --quiet && exit 0
          git commit -m "chore(landing): capture LAND-0006 project screenshots"
          git push origin HEAD:feat/LAND-0006-project-showcase
