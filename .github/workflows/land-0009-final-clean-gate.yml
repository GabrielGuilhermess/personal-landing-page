name: LAND-0009 final clean gate

on:
  push:
    branches:
      - chore/LAND-0009-final-clean-gate

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0

      - name: Resolve stable pnpm
        run: |
          PNPM_VERSION="$(npm view pnpm version)"
          npm install --global "pnpm@${PNPM_VERSION}"
          echo "PNPM_VERSION=${PNPM_VERSION}" >> "$GITHUB_ENV"

      - name: Normalize manifest and migrate lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[group] ?? {})) {
              const entry = lock.packages[`node_modules/${name}`];
              if (!entry?.version) throw new Error(`Missing resolved version for ${name}`);
              pkg[group][name] = entry.version;
            }
          }
          pkg.scripts.lint = 'eslint . --max-warnings=0';
          pkg.packageManager = `pnpm@${process.env.PNPM_VERSION}`;
          pkg.engines = { node: '24.x', pnpm: process.env.PNPM_VERSION };
          delete pkg.pnpm;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync('.nvmrc', '24.20.0\n');
          fs.writeFileSync('.node-version', '24.20.0\n');
          fs.writeFileSync('.npmrc', 'save-exact=true\nengine-strict=true\n');
          NODE
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - .

          allowBuilds:
            unrs-resolver: true

          overrides:
            brace-expansion@1.1.13: 1.1.18
            brace-expansion@5.0.5: 5.0.9
            browserslist@4.28.1: 4.28.7
            postcss-selector-parser@6.1.2: 6.1.3
          EOF
          pnpm import

      - name: Upgrade supported toolchain and patched dependencies
        run: |
          pnpm add --save-exact next@16 react@19.2 react-dom@19.2
          pnpm add --save-exact --save-dev \
            eslint@9.39.5 \
            eslint-config-next@16 \
            @types/node@24 \
            @types/react@19 \
            @types/react-dom@19 \
            postcss@latest \
            autoprefixer@latest
          pnpm remove framer-motion lucide-react
          rm package-lock.json
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";

          export default defineConfig([
            ...nextVitals,
            globalIgnores([".next/**", "out/**", "build/**", "next-env.d.ts"]),
          ]);
          EOF
          rm .eslintrc.json

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify exact direct dependency pins
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(pkg[group] ?? {})) {
              if (!/^\d+\.\d+\.\d+(?:[-+].+)?$/.test(version)) {
                throw new Error(`${group}.${name} is not exactly pinned: ${version}`);
              }
            }
          }
          NODE

      - name: Report effective versions
        run: |
          node --version
          pnpm --version
          pnpm exec next --version
          pnpm exec eslint --version
          pnpm exec tsc --version
          pnpm list --depth 0

      - name: Lint
        run: |
          start=$(date +%s%3N)
          pnpm lint
          end=$(date +%s%3N)
          echo "LINT_MS=$((end-start))" >> "$GITHUB_ENV"
          echo "Lint duration: $((end-start)) ms"

      - name: Production build
        run: |
          start=$(date +%s%3N)
          pnpm build
          end=$(date +%s%3N)
          echo "BUILD_MS=$((end-start))" >> "$GITHUB_ENV"
          echo "Build duration: $((end-start)) ms"

      - name: Verify build does not rewrite tracked config
        run: git diff --exit-code -- tsconfig.json next-env.d.ts

      - name: Security audit
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            ghcr.io/google/osv-scanner@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475 \
            scan -L /src/pnpm-lock.yaml --format json --output-file /src/osv.json

      - name: Dependency freshness report
        if: always()
        run: pnpm outdated --format json > outdated.json || true

      - name: Gate summary
        if: always()
        run: |
          echo "Lint: ${LINT_MS:-not-completed} ms"
          echo "Build: ${BUILD_MS:-not-completed} ms"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: land-0009-final-clean
          path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            eslint.config.mjs
            .nvmrc
            .node-version
            .npmrc
            osv.json
            outdated.json
          include-hidden-files: true
          retention-days: 1

      - name: Publish validated state to LAND-0009 work branch
        if: success()
        env:
          TARGET_BRANCH: test/LAND-0009-accessibility-locale-performance
          EXPECTED_TARGET_SHA: 6327487dfc05f0e26dcabb39903624114014d68c
        run: |
          set -euo pipefail
          mkdir -p /tmp/land9-final/src/design-system/tokens /tmp/land9-final/src/design-system/components
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.mjs .nvmrc .node-version .npmrc /tmp/land9-final/
          cp src/design-system/tokens/animations.ts /tmp/land9-final/src/design-system/tokens/animations.ts
          cp src/design-system/components/index.ts /tmp/land9-final/src/design-system/components/index.ts

          git fetch origin "$TARGET_BRANCH"
          actual_target_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$actual_target_sha" != "$EXPECTED_TARGET_SHA" ]; then
            echo "Target branch changed: expected $EXPECTED_TARGET_SHA, got $actual_target_sha"
            exit 1
          fi

          git checkout -B "$TARGET_BRANCH" "$actual_target_sha"
          cp /tmp/land9-final/package.json ./package.json
          cp /tmp/land9-final/pnpm-lock.yaml ./pnpm-lock.yaml
          cp /tmp/land9-final/pnpm-workspace.yaml ./pnpm-workspace.yaml
          cp /tmp/land9-final/eslint.config.mjs ./eslint.config.mjs
          cp /tmp/land9-final/.nvmrc ./.nvmrc
          cp /tmp/land9-final/.node-version ./.node-version
          cp /tmp/land9-final/.npmrc ./.npmrc
          cp /tmp/land9-final/src/design-system/tokens/animations.ts ./src/design-system/tokens/animations.ts
          cp /tmp/land9-final/src/design-system/components/index.ts ./src/design-system/components/index.ts
          rm -f package-lock.json .eslintrc.json src/design-system/components/SkillIcon.tsx

          git add -A package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.mjs .eslintrc.json .nvmrc .node-version .npmrc src/design-system/tokens/animations.ts src/design-system/components/index.ts src/design-system/components/SkillIcon.tsx
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git config user.name "Gabriel Guilherme Santos da Silva"
          git config user.email "gabrielguilhermebcc@gmail.com"
          git commit -m "chore(toolchain): finalize LAND-0009 dependency baseline"
          git push origin HEAD:"$TARGET_BRANCH"
